---
- name: Install Python 3 and pip
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ service_user }}"
    mode: "0755"

- name: Copy application files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ app_dir }}/"
    owner: "{{ service_user }}"
    mode: "0644"
  loop:
    - "{{ microservice_src }}/app.py"
    - "{{ microservice_src }}/requirements.txt"
  notify: Restart metrics service

- name: Install Python dependencies
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    executable: pip3

- name: Create systemd unit file
  ansible.builtin.template:
    src: metrics-service.service.j2
    dest: /etc/systemd/system/{{ service_name }}.service
    mode: "0644"
  notify: Restart metrics service

- name: Enable and start service
  ansible.builtin.systemd:
    name: "{{ service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Check if firewalld is running
  ansible.builtin.command: systemctl is-active firewalld
  register: firewalld_status
  ignore_errors: true
  changed_when: false

- name: Open port in firewalld
  ansible.posix.firewalld:
    port: "{{ service_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: firewalld_status.rc == 0
